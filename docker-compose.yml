services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wynajem
      POSTGRES_PASSWORD: wynajem
      POSTGRES_DB: wynajem
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wynajem"]
      interval: 5s
      timeout: 3s
      retries: 5

  apprise:
    image: caronc/apprise:latest
    ports:
      - "8000:8000"

volumes:
  pgdata:
