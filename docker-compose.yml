services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wynajem
      # Dev default; override via env (POSTGRES_PASSWORD) and rotate before any non-loopback exposure.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wynajem}
      POSTGRES_DB: wynajem
    ports:
      # Loopback-only: reachable from host (tests, trigger.dev dev) but not from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wynajem"]
      interval: 5s
      timeout: 3s
      retries: 5

  apprise:
    image: caronc/apprise:latest
    ports:
      # Loopback-only: unauthenticated gateway, must not be exposed to the network.
      - "127.0.0.1:8000:8000"

  app:
    build: .
    environment:
      DATABASE_URL: postgres://wynajem:wynajem@db:5432/wynajem
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      APPRISE_URL: http://apprise:8000
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      apprise:
        condition: service_started

volumes:
  pgdata:
