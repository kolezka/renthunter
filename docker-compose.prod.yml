# Production stack — self-contained, no trigger.dev / no cloud dependency.
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# The scheduled crawl runs IN-PROCESS inside the app (src/pipeline/scheduler.ts),
# driven by config.pollIntervalMin from the DB (editable in the panel; 0 = off).
# No sidecar, no external trigger. Postgres is never exposed off the host. Put a
# reverse proxy / TLS (Caddy, Traefik, nginx) in front of the app.
name: trojmiasto-wynajem-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wynajem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: wynajem
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wynajem"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port: Postgres is reachable only on the internal compose network.

  apprise:
    image: caronc/apprise:latest
    restart: unless-stopped
    # Internal-only: no host port; only the app reaches it over the compose network.

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://wynajem:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@db:5432/wynajem
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      APPRISE_URL: http://apprise:8000
      PORT: "3000"
    ports:
      # Bind to the host; front it with a reverse proxy for TLS on a dedicated server.
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      apprise:
        condition: service_started
    healthcheck:
      # The slim image has no curl/wget; use bun itself to probe the API.
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  pgdata:
