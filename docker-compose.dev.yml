# Development stack — hot-reload, one command:
#   docker compose -f docker-compose.dev.yml up          # db + app only (default)
#   docker compose -f docker-compose.dev.yml --profile notifications up   # + apprise
#   docker compose -f docker-compose.dev.yml --profile embeddings up      # + local ollama
#   docker compose -f docker-compose.dev.yml --profile browserless up     # + local browserless
# Ports are loopback-only so `bun test` and `trigger:dev` on the host can still
# reach the DB. The app runs from bind-mounted source with `bun --hot`.
name: renthunter-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: renthunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renthunter}
      POSTGRES_DB: renthunter
    ports:
      # Loopback-only: host tools (tests, trigger:dev) reach it; the network can't.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renthunter"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Notification gateway (Apprise). Opt-in: only started with `--profile notifications`
  # (or COMPOSE_PROFILES=notifications). A plain `docker compose -f docker-compose.dev.yml up`
  # runs db + app only. The app degrades gracefully without it: sendNotification is a no-op
  # when no targets are configured, and a failed notify is caught per-offer (the crawl
  # continues). To notify without running this, point APPRISE_URL at an external instance.
  apprise:
    image: caronc/apprise:latest
    profiles: ["notifications"]
    ports:
      # Loopback-only: unauthenticated gateway, must not be exposed to the network.
      - "127.0.0.1:8000:8000"

  # Local, free embeddings provider (OpenAI-compatible /v1/embeddings). The app
  # points EMBED_BASE_URL here, so semantic search needs no paid API key.
  #
  # Opt-in: only started with `--profile embeddings` (or COMPOSE_PROFILES=embeddings).
  # A plain `docker compose -f docker-compose.dev.yml up` runs WITHOUT Ollama; enable
  # the profile AND the Embeddings toggle in the panel to use semantic search.
  ollama:
    image: ollama/ollama:latest
    profiles: ["embeddings"]
    ports:
      # Loopback-only: reachable from the host for debugging, not from the network.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: pull the embedding model once Ollama is healthy, then exit.
  # Idempotent — a no-op if the model is already in the ollama volume.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["embeddings"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${EMBED_MODEL:-bge-m3}"]
    restart: "no"

  # Headless-Chrome fetch backend (browserless v2). Opt-in: `--profile browserless`.
  # Renders JS-heavy pages via POST /content from the container's own egress IP, so a
  # blocked host IP never hits the portals directly. Heavy (Chrome), off by default.
  # `make up-browserless` starts this AND sets the app's BROWSERLESS_URL/TOKEN to match;
  # a plain `up` leaves BROWSERLESS_URL empty (direct fetch). NOTE: fetchPage has no
  # direct-fetch fallback — a set-but-unreachable browserless fails every scrape, so only
  # point BROWSERLESS_URL here together with this service running.
  browserless:
    image: ghcr.io/browserless/chromium:latest
    profiles: ["browserless"]
    environment:
      # Must match the app's BROWSERLESS_TOKEN (set together by `make up-browserless`).
      TOKEN: ${BROWSERLESS_TOKEN:-local-dev}
    ports:
      # Loopback-only: reachable from the host for debugging, not from the network.
      - "127.0.0.1:3010:3000"

  app:
    image: oven/bun:1
    working_dir: /app
    # `bun run dev` = build the SPA once, then `bun --hot` the API (server reload).
    # NOTE: frontend (web/) edits need a re-run of the build; only the server hot-reloads.
    # `migrate` (not `push`) applies versioned migrations idempotently — it tracks
    # what's applied and never recreates tables, so DB data survives restarts.
    command: sh -c "bun install --frozen-lockfile && bunx drizzle-kit migrate && bun run dev"
    environment:
      # Compose `environment:` wins over the bind-mounted host .env — verified: Bun
      # gives real env vars precedence over .env file values. So this `db` host (not
      # the host .env's `localhost`) is what the app actually uses inside the network.
      DATABASE_URL: postgres://renthunter:${POSTGRES_PASSWORD:-renthunter}@db:5432/renthunter
      # Route all AI (scoring + embeddings) through a self-hosted LiteLLM proxy with a
      # single key. When set, config.ts prefers these over the DEEPSEEK_*/EMBED_* vars
      # below — so litellm needs no local Ollama.
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      SCORER_MODEL: ${SCORER_MODEL:-deepseek/deepseek-chat}
      # Embeddings fall back to the opt-in local Ollama service (--profile embeddings) when
      # LITELLM_BASE_URL is unset. Override these to use OpenAI/Jina directly.
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://ollama:11434/v1}
      EMBED_API_KEY: ${EMBED_API_KEY:-ollama}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      APPRISE_URL: ${APPRISE_URL:-http://apprise:8000}
      PORT: "3000"
      BROWSERLESS_URL: ${BROWSERLESS_URL:-}
      BROWSERLESS_TOKEN: ${BROWSERLESS_TOKEN:-}
    ports:
      # Bind to all interfaces so other devices on the LAN can reach the app
      # (e.g. http://<your-host-LAN-ip>:3000). DB/apprise below stay loopback-only.
      - "0.0.0.0:3005:3000"
    volumes:
      - .:/app
      # Anonymous volume: keep the container's linux node_modules, don't share the
      # host's darwin one (native deps would break across platforms).
      - /app/node_modules
    # Only depends_on db. apprise and ollama are both opt-in profiles (notifications /
    # embeddings) and the app degrades gracefully when either is unreachable, so boot
    # must not block on services that may not be running.
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
