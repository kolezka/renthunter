# Development stack — full app, hot-reload, one command:
#   docker compose -f docker-compose.dev.yml up
# Ports are loopback-only so `bun test` and `trigger:dev` on the host can still
# reach the DB/apprise. The app runs from bind-mounted source with `bun --hot`.
name: renthunter-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: renthunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renthunter}
      POSTGRES_DB: renthunter
    ports:
      # Loopback-only: host tools (tests, trigger:dev) reach it; the network can't.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renthunter"]
      interval: 5s
      timeout: 3s
      retries: 5

  apprise:
    image: caronc/apprise:latest
    ports:
      # Loopback-only: unauthenticated gateway, must not be exposed to the network.
      - "127.0.0.1:8000:8000"

  # Local, free embeddings provider (OpenAI-compatible /v1/embeddings). The app
  # points EMBED_BASE_URL here, so semantic search needs no paid API key.
  ollama:
    image: ollama/ollama:latest
    ports:
      # Loopback-only: reachable from the host for debugging, not from the network.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: pull the embedding model once Ollama is healthy, then exit.
  # Idempotent — a no-op if the model is already in the ollama volume.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${EMBED_MODEL:-bge-m3}"]
    restart: "no"

  app:
    image: oven/bun:1
    working_dir: /app
    # `bun run dev` = build the SPA once, then `bun --hot` the API (server reload).
    # NOTE: frontend (web/) edits need a re-run of the build; only the server hot-reloads.
    # `migrate` (not `push`) applies versioned migrations idempotently — it tracks
    # what's applied and never recreates tables, so DB data survives restarts.
    command: sh -c "bun install --frozen-lockfile && bunx drizzle-kit migrate && bun run dev"
    environment:
      # Compose `environment:` wins over the bind-mounted host .env — verified: Bun
      # gives real env vars precedence over .env file values. So this `db` host (not
      # the host .env's `localhost`) is what the app actually uses inside the network.
      DATABASE_URL: postgres://renthunter:${POSTGRES_PASSWORD:-renthunter}@db:5432/renthunter
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # Default to the local Ollama service (free). Override these to use OpenAI/Jina.
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://ollama:11434/v1}
      EMBED_API_KEY: ${EMBED_API_KEY:-ollama}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      APPRISE_URL: http://apprise:8000
      PORT: "3000"
      BROWSERLESS_URL: ${BROWSERLESS_URL:-}
      BROWSERLESS_TOKEN: ${BROWSERLESS_TOKEN:-}
    ports:
      # Bind to all interfaces so other devices on the LAN can reach the app
      # (e.g. http://<your-host-LAN-ip>:3000). DB/apprise below stay loopback-only.
      - "0.0.0.0:3001:3000"
    volumes:
      - .:/app
      # Anonymous volume: keep the container's linux node_modules, don't share the
      # host's darwin one (native deps would break across platforms).
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      apprise:
        condition: service_started
      # Wait for Ollama to be up (network alias). Embeddings still degrade
      # gracefully if the model pull hasn't finished yet.
      ollama:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
